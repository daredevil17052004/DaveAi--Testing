[pytest]
testpaths = tests
; Each test file is listed explicitly to prevent double-collection.
; api_tests.py and ui_tests.py are the real test files (assignment filenames).
; test_ui_playwright.py is the bonus Playwright suite.
; test_api.py and test_ui.py are NOT listed — they are source modules only.
python_files = api_tests.py ui_tests.py test_ui_playwright.py
python_classes = Test*
python_functions = test_*
markers =
    api: Marks tests as API automation tests (Reqres.in)
    ui: Marks tests as UI automation tests (DaveAI)
    playwright: Marks tests as Playwright UI automation tests
addopts = -v --tb=short
